<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/img/taco-regular-full.svg">
    <title>TaCoS Drive</title>
    <style>
        :root {
            --bg-color: #f4f4f4;
            --text-color: #333;
            --accent-color: #2c3e50;
        }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            line-height: 1.6;
            color: var(--text-color);
        }

        main {
            max-width: 600px;
            padding: 2rem;
            text-align: center;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 1rem;
        }

        p {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <main style="visibility: hidden;">
        <article>
            <h1>Authorization missing</h1>
            <p>You have not been granted authorization yet to access the drive. Please contact <a href="mailto:tacos@cl.uni-heidelberg.de">tacos@cl.uni-heidelberg.de</a> to get access.</p>
        </article>
    </main>

    <script>
        const driveUrl = localStorage.getItem("driveUrl")
        if (driveUrl && driveUrl.startsWith("https://cryptpad.fr")) {
            window.location.href = driveUrl
        } else {
            document.querySelector("main").style.visibility = "visible"
        }
    </script>
</body>
</html>
